# OpenSSL 3's target for Syllable (Configure --config=this syllable-x86):
# Linux's ELF i386 target without what Syllable doesn't have, or has
# elsewhere: libdl (the tree's), pthreads, the Linux crypto engines.
my %targets = (
    "syllable-x86" => {
        inherit_from     => [ "linux-elf" ],
        ex_libs          => "",
        thread_scheme    => "(unknown)",
        enable           => [],
        # built by GCC 9.5.0: its libgcc linked in, not needed at run time
        shared_ldflag    => "-static-libgcc -Wl,-znodelete",
    },
);
