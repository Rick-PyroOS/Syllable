# Pyro boot menu (GRUB 2)
#
# Syllable's kernel finds each boot module by "/drivers/" or "/config/" in the
# module's command line, and GRUB 2 does not put the file name there (GRUB
# legacy did), so every module line repeats its path.
# --quirk-modules-after-kernel keeps the modules right after the kernel, below
# the kernel's 1.5 GiB memory cap.
#
# The kernel asks for a 1024x768x32 graphics mode in its Multiboot header
# (GRUB's multiboot command sets gfxpayload from it), then draws its boot
# splash (splash.img, a boot module) with a progress bar until the appserver
# takes over.  splash=false shows the kernel log on screen instead;
# quiet=true keeps it off the screen when there is no graphics mode.

set timeout=5
set default=0

serial --unit=0 --speed=115200
terminal_input console serial

insmod all_video
insmod gfxterm
insmod gfxmenu
insmod png
if loadfont $prefix/fonts/dejavu-sans-mono-16.pf2 ; then
    loadfont $prefix/fonts/dejavu-sans-14.pf2
    loadfont $prefix/fonts/dejavu-sans-bold-16.pf2
    set gfxmode=1024x768,800x600,auto
    terminal_output gfxterm serial
    # The theme draws the picture and places the menu; without it (a missing
    # file) the menu still works over a plain gfxterm.
    set theme=$prefix/theme/theme.txt
else
    terminal_output console serial
fi

# The boot volume the kernel mounts; custom.cfg may change it (the installer
# writes one with the partition it installed to).
set pyro_root=/dev/disk/ata/hda/0
set pyro_serial="debug_port=1 debug_baudrate=115200 debug_plaintext=true"

function pyro_modules {
    module /system/config/kernel.cfg        /system/config/kernel.cfg
    module /system/drivers/dev/bus/pci      /system/drivers/dev/bus/pci
    module /system/drivers/dev/bus/ata      /system/drivers/dev/bus/ata
    module /system/drivers/dev/hcd/ata_pci  /system/drivers/dev/hcd/ata_pci
    module /system/drivers/fs/afs           /system/drivers/fs/afs
    module /boot/grub/splash.img            /boot/grub/splash.img
}

menuentry "Pyro" --id pyro {
    multiboot --quirk-modules-after-kernel /system/kernel.so /system/kernel.so root=$pyro_root disable_acpi=true quiet=true
    pyro_modules
}

# Kernel messages go to the first serial port as plain text (sb boot-test).
menuentry "Pyro, kernel log on COM1" --id pyro-serial {
    multiboot --quirk-modules-after-kernel /system/kernel.so /system/kernel.so root=$pyro_root disable_acpi=true $pyro_serial
    pyro_modules
}

menuentry "Pyro, kernel log on screen" --id pyro-log {
    multiboot --quirk-modules-after-kernel /system/kernel.so /system/kernel.so root=$pyro_root disable_acpi=true splash=false
    pyro_modules
}

menuentry "Pyro (force PCI hardware detection)" --id pyro-pci {
    multiboot --quirk-modules-after-kernel /system/kernel.so /system/kernel.so root=$pyro_root disable_acpi=true disable_config=true
    pyro_modules
}

# Local changes go in custom.cfg next to this file (for example
# "set default=pyro-serial" or "set pyro_root=/dev/disk/ata/hda/1"), so that
# an update can replace grub.cfg.
if [ -f $prefix/custom.cfg ]; then
    source $prefix/custom.cfg
fi
